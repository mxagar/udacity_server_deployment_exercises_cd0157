[project]
name = "udacity-jwt-api"
version = "0.1.0"
description = "Flask JWT API for the server deployment course project"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "flask>=3.1.3,<4",
    "pyjwt>=2.15.1,<3",
    "gunicorn>=26.2.0,<27; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["pytest>=9.2.0,<10"]

[tool.uv]
package = false
