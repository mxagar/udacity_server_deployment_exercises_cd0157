[project]
name = "udacity-jwt-api"
version = "0.1.0"
description = "Flask JWT API for the server deployment course project"
readme = "README.md"
requires-python = ">=3.7,<3.14"
dependencies = [
    # Exact pins keep the historical Python 3.7.4 image and host tests compatible.
    "flask==2.2.5",
    "werkzeug==2.2.3",
    "jinja2==3.1.6",
    "markupsafe==2.1.5",
    "itsdangerous==2.1.2",
    "click==8.1.8",
    "pyjwt==2.8.0",
    "gunicorn==23.0.0; sys_platform != 'win32'",
    "packaging==23.2",
    "importlib-metadata==6.7.0; python_version < '3.10'",
    "zipp==3.15.0; python_version < '3.10'",
    "typing-extensions==4.7.1; python_version < '3.8'",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "iniconfig==2.0.0",
    "pluggy==1.2.0",
    "exceptiongroup==1.2.2; python_version < '3.11'",
    "tomli==2.0.1; python_version < '3.11'",
    "colorama==0.4.6; sys_platform == 'win32'",
]

[tool.uv]
package = false
