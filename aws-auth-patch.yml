# Illustration only: fetch the live aws-auth ConfigMap before editing it.
# Preserve its real node-role entries and metadata instead of applying these placeholders.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - groups:
        - system:bootstrappers
        - system:nodes
      rolearn: arn:aws:iam::<ACCOUNT_ID>:role/<EXISTING_NODE_ROLE_NAME>
      username: system:node:{{EC2PrivateDNSName}}
    - groups:
        - system:masters
      rolearn: arn:aws:iam::<ACCOUNT_ID>:role/UdacityFlaskDeployCBKubectlRole
      username: build
