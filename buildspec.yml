---
version: 0.2


phases:
  install:
    runtime-versions:
      python: "3.13"
    commands:
      - echo 'about to call dockerd'
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2&
      - timeout 15 sh -c "until docker info; do echo .; sleep 1; done"
      # AWS CLI v2 provides aws eks get-token; a separate aws-iam-authenticator download is no longer needed.
      # Download the latest stable release kubectl
      # - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      # You must use a kubectl version that is within one minor version difference of your Amazon EKS cluster control plane.
      # For example, a 1.37 kubectl client works with Kubernetes 1.36, 1.37 and 1.38 clusters.
      # Use the commented latest-stable command only if it satisfies this version compatibility rule.
      # Ref: https://docs.aws.amazon.com/eks/latest/userguide/install-kubectl.html OR https://kubernetes.io/docs/tasks/tools/install-kubectl-linux/
      # To download a specific version v1.37.2 on Linux, set KUBECTL_VERSION below and use:
      - curl -fsSL -O "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
      # Download the kubectl checksum file
      - curl -fsSL -O "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256"
      # Validate the kubectl binary against the checksum file (the downloaded file contains only the digest)
      - echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
      # Install kubectl
      - chmod +x ./kubectl
      # - mkdir -p $HOME/bin && cp ./kubectl $HOME/bin/kubectl && export PATH=$PATH:$HOME/bin
      - export PATH=$PWD/:$PATH
      - python --version
      - echo 'export PATH=$PWD/:$PATH' >> $HOME/.bashrc
      - echo `kubectl version --client`
      # Install uv instead of upgrading pip; dependencies are synchronized in pre_build.
      - curl -fsSL https://astral.sh/uv/0.13.7/install.sh -o /tmp/install-uv.sh
      - UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh /tmp/install-uv.sh
      # The CodeBuild image supplies AWS CLI v2; do not replace it with the Python awscli package (v1).
      - aws --version
      - apt-get update && apt-get -y install jq
  pre_build:
    commands:
      - TAG="$REPOSITORY_NAME.$REPOSITORY_BRANCH.$ENVIRONMENT_NAME.$(date +%Y-%m-%d.%H.%M.%S).$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | head -c 8)"
      - sed -i 's@CONTAINER_IMAGE@'"$REPOSITORY_URI:$TAG"'@' simple_jwt_api.yml
      # AWS CLI v2 replaces ecr get-login with get-login-password.
      - aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
      - export KUBECONFIG=$HOME/.kube/config
      - echo `ls -l`
      # Includes the project's locked pytest development dependency.
      - uv sync --locked
      - uv run --locked python -m pytest test_main.py
  build:
    commands:
      - docker build --tag $REPOSITORY_URI:$TAG .
      # Verify the same suite on the actual Python 3.13 runtime before publishing.
      # Test dependencies are installed only in this disposable container, not the runtime image.
      - >-
        docker run --rm --entrypoint sh
        --mount "type=bind,source=$PWD/test_main.py,target=/app/test_main.py,readonly"
        "$REPOSITORY_URI:$TAG"
        -c 'uv sync --locked && uv run --locked python -m pytest /app/test_main.py'

  post_build:
    commands:
      # CodeBuild can enter post_build after an earlier failure. Never publish or deploy it.
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"
      - docker push $REPOSITORY_URI:$TAG
      - echo $EKS_CLUSTER_NAME
      - echo $EKS_KUBECTL_ROLE_ARN
      - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --role-arn $EKS_KUBECTL_ROLE_ARN
      - kubectl apply -f simple_jwt_api.yml
      - kubectl rollout status deployment/simple-jwt-api --namespace default --timeout=180s
      - printf '[{"name":"simple_jwt_api","imageUri":"%s"}]' $REPOSITORY_URI:$TAG > build.json
artifacts:
  files: build.json
env:
  shell: bash
  variables:
    # Match the cluster's Kubernetes minor version; update this pin for another cluster version.
    KUBECTL_VERSION: v1.37.2
  parameter-store:
    JWT_SECRET: JWT_SECRET
